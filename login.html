<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTubeNotes - Login</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">  </head>
<body>
<div class="container"> <div class="login">  <h1>Login</h1>  {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="post" action="{{ url_for('user_login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" class="form-control" required>
                </div>
                <div class = "button">
                <button type="submit" class="btn btn-primary btn-block">Login</button>  <p class="text-center mt-2">Don't have an account? <a href="{{ url_for('user_register') }}">Register here</a>.</p>
                </div>
            </div>
            <div class="image-section">
                
            </div>
            </form>
       

</body>
</html>
