<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EduTubeNotes - Register</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>
<div class="container"> <div class="row-center box">  <div class="col-md-9 col-lg-10">
    <h2 class="mt-4">Register</h2>
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('user_register') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
        <p class="mt-2">Already have an account? <a href="{{ url_for('user_login') }}">Login here</a>.</p>
    </form>
    <div class="social-login">
        <button><img src="https://img.icons8.com/color/48/000000/twitter--v2.png" alt="Twitter" width="20"/> Sign in with Twitter</button>
        <button><img src="https://img.icons8.com/color/48/000000/facebook-new.png" alt="Facebook" width="20"/> Sign in with Facebook</button>
    </div>
    
</div>

</div>
</div>
</body>
</html>
