<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EduTubeNotes - Home</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel= "stylesheet"type="text/css"  href="{{ url_for('static', filename='css/home.css') }}">
</head>
<body>
<header class="container-fluid">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <img src="static\css/images2.jpeg" class="logo">
        <a class="navbar-brand" href="#">EduTubeNotes</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('view_summarizations') }}">My Summaries</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                </li>
            </ul>
        </div>
    </nav>
</header>

<section class="hero-section d-flex align-items-center justify-content-center">
    <div class="text-center">
        <h1 class="display-4">Summarize, Organize, and Learn Faster</h1>
        <p class="lead">From Videos to Notes in a Click</p>

        <div class="form-container">
            <form method="post" action="{{ url_for('home') }}" class="form-inline">
                <label for="youtube_url" class="sr-only">YouTube URL</label>
                <input type="text" class="form-control" id="youtube_url" name="youtube_url" placeholder="Enter YouTube URL" required>
                <button type="submit" class="btn btn-primary">Summarize</button>
            </form>

            <form id="uploadForm" enctype="multipart/form-data">
                <input type="file" id="fileInput" name="fileInput" accept="audio/*,video/*" required>
                <button type="submit" class="btn btn-primary">Upload & Summarize</button>
            </form>
        </div>

        <div id="output"></div> 
    </div>
</section>
    
{% if error %}
<div class="alert alert-danger text-center">{{ error }}</div>
{% endif %}

<footer class="container text-center mt-5">
<p>&copy; 2024 EduTubeNotes. All rights reserved.</p>
</footer>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const uploadForm = document.getElementById('uploadForm');
        const output = document.getElementById('output');

uploadForm.addEventListener('submit', function (event) {
    event.preventDefault();  // Prevent the form from submitting the traditional way

    const formData = new FormData(uploadForm);

    // Show loading message
    output.innerHTML = 'Uploading and summarizing...';

    // Send the file to the server using Fetch API
    fetch('http://localhost:5000/upload', {
        method: 'POST',
        body: formData
    })
    .then(response => {
        if (!response.ok) {
            return response.json().then(err => {
                throw new Error(err.error || 'Network response was not ok');
            });
        }
        return response.json();
    })
    .then(data => {
       
        // Display the summary if available
        if (data.summary) {
              // Encode the summary for URL
              const encodedSummary = encodeURIComponent(data.summary);
              window.location.href = `upload.html?summary=${encodedSummary}`;
        }
        else{
            output.innerHTML=`Summary processing failed.`;
        }
    })
    .catch(error => {
        output.innerHTML = `Fetch error: ${error.message}`;
    });
});
});
</script>

</body>
</html>
