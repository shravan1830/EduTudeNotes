<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chatbot.css') }}"><!-- Link to the CSS file -->
    <script>
        async function sendMessage() {
            const messageInput = document.getElementById('messageInput').value;
            const responseElement = document.getElementById('response');
            const chatContainer = document.getElementById('chatContainer');

            // Add user's message to chat
            chatContainer.innerHTML += `<div class="user-message">${messageInput}</div>`;
            messageInput.value = ""; // Clear input field

            try {
                const response = await fetch('http://127.0.0.1:5000/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: messageInput }),
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                // Add bot's response to chat
                chatContainer.innerHTML += `<div class="bot-message">${data.response}</div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight; // Auto-scroll to bottom

            } catch (error) {
                console.error('Error:', error);
                responseElement.textContent = 'An error occurred. Please try again.';
            }
        }
    </script>
</head>
<body>
    <div class="chatbot-container">
        <h1>Chatbot</h1>
        <div id="chatContainer" class="chat-container"></div>
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Type your message..." />
            <button onclick="sendMessage()">Send</button>
        </div>
        <p id="response"></p>
    </div>
</body>
</html>
